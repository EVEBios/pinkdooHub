name: pinkdoohub-gatea

x-app-service: &app-service
  image: ${GATEA_APP_IMAGE:?Set GATEA_APP_IMAGE to an immutable Git-SHA tag}
  env_file:
    - ${GATEA_CONFIG_FILE:-/etc/pinkdoohub/gatea/config.env}
  secrets:
    - mysql_app_password
    - redis_password
    - jwt_secret
  networks:
    - backend
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true

services:
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --skip-name-resolve
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in the Gate A config file}
      MYSQL_USER: ${DB_USER:?Set DB_USER in the Gate A config file}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_app_password
      - mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)"
          mysqladmin ping --host=127.0.0.1 --user=root --silent
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    mem_limit: 1400m
    cpus: 1.0
    networks:
      - backend

  redis:
    image: redis:8.0.1-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - >-
        printf '%s\n'
        "requirepass $$(cat /run/secrets/redis_password)"
        'appendonly yes'
        'appendfsync everysec'
        'maxmemory 256mb'
        'maxmemory-policy noeviction'
        > /tmp/pinkdoohub-redis.conf;
        exec redis-server /tmp/pinkdoohub-redis.conf
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password)"
          redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    cpus: 0.35
    networks:
      - backend

  image-init:
    image: ${GATEA_APP_IMAGE:?Set GATEA_APP_IMAGE to an immutable Git-SHA tag}
    network_mode: none
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 10001:10001 /data/images && chmod 0755 /data/images"]
    restart: "no"
    volumes:
      - product_images:/data/images
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *app-service
    profiles: ["operations"]
    restart: "no"
    command: ["aerich", "--app", "models", "upgrade"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    <<: *app-service
    restart: unless-stopped
    volumes:
      - product_images:/data/images
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      image-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 768m
    cpus: 0.75

  nginx:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - product_images:/data/uploads/products:ro
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - edge

secrets:
  mysql_app_password:
    file: ${GATEA_SECRET_DIR:-/etc/pinkdoohub/gatea/secrets}/mysql_app_password
  mysql_root_password:
    file: ${GATEA_SECRET_DIR:-/etc/pinkdoohub/gatea/secrets}/mysql_root_password
  redis_password:
    file: ${GATEA_SECRET_DIR:-/etc/pinkdoohub/gatea/secrets}/redis_password
  jwt_secret:
    file: ${GATEA_SECRET_DIR:-/etc/pinkdoohub/gatea/secrets}/jwt_secret

volumes:
  mysql_data:
    name: pinkdoohub-gatea-mysql-data
  redis_data:
    name: pinkdoohub-gatea-redis-data
  product_images:
    name: pinkdoohub-gatea-product-images

networks:
  backend:
    name: pinkdoohub-gatea-backend
    internal: true
  edge:
    name: pinkdoohub-gatea-edge
