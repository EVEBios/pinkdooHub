server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types application/json application/problem+json application/javascript
           application/xml image/svg+xml text/css text/plain;

map $uri $gatea_log_uri {
    ~^/api/v1/table-codes/ /api/v1/table-codes/<redacted>;
    default $uri;
}

log_format gatea '$remote_addr [$time_local] '
                 '"$request_method $gatea_log_uri $server_protocol" $status $body_bytes_sent '
                 'request_time=$request_time request_id=$request_id '
                 'user_agent="$http_user_agent"';

server {
    # 在 server 层覆盖官方镜像 http 层的 main 日志，避免双写原始码路径。
    access_log /var/log/nginx/access.log gatea;
    listen 8080;
    server_name _;

    client_max_body_size 3m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /uploads/products/ {
        root /data;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
