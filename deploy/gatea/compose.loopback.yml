services:
  nginx:
    ports:
      - "127.0.0.1:${GATEA_LOOPBACK_PORT:-18080}:8080"
    volumes:
      - ./nginx/loopback.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:8080/api/v1/health/live
      interval: 10s
      timeout: 3s
      retries: 12
